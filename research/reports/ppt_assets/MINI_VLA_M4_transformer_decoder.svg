<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1560" viewBox="0 0 1500 1560">
<rect width="100%" height="100%" fill="white"/>
<text x="750" y="40" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="700" fill="#071E4A">M4 · Transformer Decoder 内部架构</text>
<text x="750" y="86" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#071E4A">1层 · 4个头 · 每头32维 · 无因果mask · dropout = 0</text>
<rect x="230" y="130" width="560" height="100" rx="12" fill="#ECF8FD" stroke="#148EEB" stroke-width="1.5"/>
<text x="510.0" y="162.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">10个可学习动作查询</text>
<text x="510.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">按batch扩展：[B, 10, 128]</text>
<polyline points="510,230 510,300" fill="none" stroke="#148EEB" stroke-width="3"/>
<polygon points="510,300 516.0,287.0 504.0,287.0" fill="#148EEB"/>
<rect x="230" y="300" width="560" height="120" rx="12" fill="#ECF8FD" stroke="#148EEB" stroke-width="1.5"/>
