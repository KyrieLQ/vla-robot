<text x="510.0" y="1382.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">Decoder 输出：[B, 10, 128]</text>
<polyline points="790,1382 925,1382" fill="none" stroke="#148EEB" stroke-width="3"/>
<polygon points="925,1382 912.0,1376.0 912.0,1388.0" fill="#148EEB"/>
<rect x="925" y="1325" width="520" height="115" rx="12" fill="#FFF2E4" stroke="#C47721" stroke-width="1.5"/>
<text x="1185.0" y="1364.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">外接动作输出层</text>
<text x="1185.0" y="1400.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">共享 Linear 128→7 → [B,10,7]</text>
<text x="750" y="1503" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#071E4A">每个中间token保持128维；10个输出槽位分别对应动作块中的10步。</text>
</svg>