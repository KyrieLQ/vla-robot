<text x="510.0" y="520.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">残差相加 + LayerNorm</text>
<polyline points="510,260 130,260 130,520 230,520" fill="none" stroke="#C47721" stroke-width="3"/>
<polygon points="230,520 217.0,514.0 217.0,526.0" fill="#C47721"/>
<text x="88" y="390.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#C47721">残差</text>
<polyline points="510,560 510,650" fill="none" stroke="#148EEB" stroke-width="3"/>
<polygon points="510,650 516.0,637.0 504.0,637.0" fill="#148EEB"/>
<text x="630" y="604" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#071E4A">提供 Q</text>
<rect x="230" y="650" width="560" height="125" rx="12" fill="#ECF8FD" stroke="#148EEB" stroke-width="1.5"/>
<text x="510.0" y="676.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">多头交叉注意力（Cross-Attention）</text>
<text x="510.0" y="712.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">Q：查询侧；K、V：观测侧</text>
<text x="510.0" y="748.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">每个头的注意力权重：10 × 4</text>
<rect x="925" y="430" width="520" height="115" rx="12" fill="#E9F6EF" stroke="#278A66" stroke-width="1.5"/>
<text x="1185.0" y="469.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">Encoder 输出 memory</text>
<text x="1185.0" y="505.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">4个观测token：[B, 4, 128]</text>
<polyline points="1185,545 1185,712 790,712" fill="none" stroke="#278A66" stroke-width="3"/>
