<text x="510.0" y="1036.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">逐token前馈网络（FFN）</text>
<text x="510.0" y="1072.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">Linear 128→256 → GELU</text>
<text x="510.0" y="1108.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">Linear 256→128</text>
<polyline points="510,1135 510,1200" fill="none" stroke="#148EEB" stroke-width="3"/>
