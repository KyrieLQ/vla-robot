<text x="990" y="622" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#278A66">提供 K、V</text>
<text x="1130" y="807" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#278A66">两路输入在交叉注意力中交互</text>
<text x="1130" y="844" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#278A66">不拼成14个token</text>
