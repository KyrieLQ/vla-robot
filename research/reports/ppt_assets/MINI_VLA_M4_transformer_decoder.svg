<text x="510.0" y="890.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">残差相加 + LayerNorm</text>
<polyline points="510,590 130,590 130,890 230,890" fill="none" stroke="#C47721" stroke-width="3"/>
