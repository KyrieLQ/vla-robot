<text x="510.0" y="1240.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">残差相加 + LayerNorm</text>
<polyline points="510,960 130,960 130,1240 230,1240" fill="none" stroke="#C47721" stroke-width="3"/>
<polygon points="230,1240 217.0,1234.0 217.0,1246.0" fill="#C47721"/>
