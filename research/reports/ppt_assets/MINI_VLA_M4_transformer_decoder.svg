<text x="510.0" y="360.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">Q、K、V 均来自查询序列</text>
<text x="510.0" y="396.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">每个头的注意力权重：10 × 10</text>
<polyline points="510,420 510,480" fill="none" stroke="#148EEB" stroke-width="3"/>
<polygon points="510,480 516.0,467.0 504.0,467.0" fill="#148EEB"/>
