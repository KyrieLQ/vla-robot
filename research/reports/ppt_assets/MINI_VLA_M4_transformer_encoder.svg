<text x="510.0" y="920.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">残差相加 + LayerNorm</text>
<polyline points="510,610 130,610 130,920 230,920" fill="none" stroke="#C47721" stroke-width="3"/>
<polygon points="230,920 217.0,914.0 217.0,926.0" fill="#C47721"/>
<text x="88" y="765.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#C47721">残差</text>
<polyline points="510,960 510,1010" fill="none" stroke="#148EEB" stroke-width="3"/>
<polygon points="510,1010 516.0,997.0 504.0,997.0" fill="#148EEB"/>
<rect x="230" y="1010" width="560" height="85" rx="12" fill="#E9F6EF" stroke="#278A66" stroke-width="1.5"/>
<text x="510.0" y="1052.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">输出 memory：[B, 4, 128]</text>
<text x="480" y="1130" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#071E4A">memory 是当前观测编码；不是历史轨迹记忆。</text>
</svg>