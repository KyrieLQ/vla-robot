<polyline points="510,580 510,665" fill="none" stroke="#148EEB" stroke-width="3"/>
<polygon points="510,665 516.0,652.0 504.0,652.0" fill="#148EEB"/>
<rect x="230" y="665" width="560" height="145" rx="12" fill="#ECF8FD" stroke="#148EEB" stroke-width="1.5"/>
<text x="510.0" y="701.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">逐token前馈网络（FFN）</text>
<text x="510.0" y="737.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">Linear 128→256 → GELU</text>
<text x="510.0" y="773.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#071E4A">Linear 256→128</text>
<polyline points="510,810 510,880" fill="none" stroke="#148EEB" stroke-width="3"/>
