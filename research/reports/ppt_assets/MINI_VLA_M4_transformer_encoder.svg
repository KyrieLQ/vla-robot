<text x="510.0" y="540.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#071E4A">残差相加 + LayerNorm</text>
<polyline points="510,270 130,270 130,540 230,540" fill="none" stroke="#C47721" stroke-width="3"/>
<polygon points="230,540 217.0,534.0 217.0,546.0" fill="#C47721"/>
